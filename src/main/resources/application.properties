spring.application.name=network-device-monitoring
server.port=8080

# PostgreSQL connection. Override with environment variables in production.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/myapp}
spring.datasource.username=${DB_USERNAME:networkmonitor}
spring.datasource.password=${DB_PASSWORD:networkmonitor}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Automatic local-network discovery
# The service detects attached IPv4 interfaces and scans suitable /16-/32 networks.
discovery.scheduler.initial-delay=${DISCOVERY_INITIAL_DELAY:10000}
discovery.scheduler.interval=${DISCOVERY_INTERVAL:60000}

# Background reachability monitoring
monitoring.scheduler.interval=${MONITORING_INTERVAL:10000}
