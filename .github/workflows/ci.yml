name: Java CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myapp
          POSTGRES_USER: networkmonitor
          POSTGRES_PASSWORD: networkmonitor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U networkmonitor -d myapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/myapp
          DB_USERNAME: networkmonitor
          DB_PASSWORD: networkmonitor
        run: ./mvnw -B clean test
      - name: Package
        run: ./mvnw -B package -DskipTests
